name: Migrate Down

on:
  workflow_dispatch:
    inputs:
      database:
        description: "Database to roll back"
        required: true
        type: string
      steps:
        description: "Number of migrations to roll back"
        required: true
        type: number
        default: 1

permissions:
  contents: read

jobs:
  migrate-down:
    name: Rollback ${{ inputs.database }} (${{ inputs.steps }} step(s))
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@143a85f84a90555d121cde2ff5872e393a47ab9f # v1.0.0

      - name: Tailscale
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3.3.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          args: --accept-dns=true

      - name: Configure DNS
        run: |
          echo "10.0.10.1 grove-cluster-pooler-rw.internal.vw-ops.net" | sudo tee -a /etc/hosts

      - name: Install golang-migrate
        run: |
          curl -fsSL https://github.com/golang-migrate/migrate/releases/latest/download/migrate.linux-amd64.tar.gz \
            | tar -xz migrate
          sudo mv migrate /usr/local/bin/migrate

      - name: Run rollback
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DATABASE: ${{ inputs.database }}
          STEPS: ${{ inputs.steps }}
        run: |
          if ! [[ "$DATABASE" =~ ^[a-z0-9-]+$ ]] || [ ! -d "migrations/$DATABASE" ]; then
            echo "::error::Unknown database '$DATABASE'"
            exit 1
          fi
          DATABASE_URL=$(op read "op://immanent-grove/${DATABASE}-pg-app/uri-pooler-rw-lb")
          migrate \
            -path "migrations/${DATABASE}" \
            -database "$DATABASE_URL" \
            down "$STEPS"
