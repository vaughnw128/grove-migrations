name: Migrate Up

on:
  push:
    branches:
      - main
    paths:
      - "migrations/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  detect:
    name: Detect Changed Databases
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      databases: ${{ steps.changed.outputs.databases }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Detect changed database directories
        id: changed
        run: |
          changed=$(git diff --name-only HEAD^ HEAD -- 'migrations/**' \
            | grep '^migrations/' \
            | cut -d'/' -f2 \
            | sort -u \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "databases=$changed" >> "$GITHUB_OUTPUT"

  migrate:
    name: Migrate ${{ matrix.database }}
    needs: detect
    if: needs.detect.outputs.databases != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: ${{ fromJson(needs.detect.outputs.databases) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@143a85f84a90555d121cde2ff5872e393a47ab9f # v1.0.0

      - name: Tailscale
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3.3.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          args: --accept-dns=true

      - name: Configure DNS
        run: |
          echo "10.0.10.1 grove-cluster-pooler-rw.internal.vw-ops.net" | sudo tee -a /etc/hosts

      - name: Install golang-migrate
        run: |
          curl -fsSL https://github.com/golang-migrate/migrate/releases/latest/download/migrate.linux-amd64.tar.gz \
            | tar -xz migrate
          sudo mv migrate /usr/local/bin/migrate

      - name: Run migrations
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DATABASE: ${{ matrix.database }}
        run: |
          DATABASE_URL=$(op read "op://immanent-grove/${DATABASE}-pg-app/uri-pooler-rw-lb")
          migrate \
            -path "migrations/${DATABASE}" \
            -database "$DATABASE_URL" \
            up
